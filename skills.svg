    <animate attributeName="width" from="0" to="327" dur="0.9s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>

  <!-- Flutter -->
  <text x="18" y="90" font-family="Segoe UI, sans-serif" font-size="11" fill="#8b949e">Flutter</text>
